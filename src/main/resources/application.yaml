spring:
  application:
    name: portfolio-api

  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio_db
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
member-api:
  base-url: http://localhost:9090